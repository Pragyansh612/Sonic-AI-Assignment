services:
  mongo:
    image: mongo:7
    container_name: acmecorp-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
